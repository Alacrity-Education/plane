name: Build and Push Custom Plane Images

on:
  push:
    branches:
      - custom-oidc-auth
  workflow_dispatch:      # Allows you to trigger the build manually from the GitHub UI

env:
  REGISTRY: ghcr.io
  # github.repository will automatically evaluate to "your-username/plane"
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - app: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - app: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - app: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          # live carries this fork's workspace wiki document type and Excalidraw
          # support, so the stock upstream image does not work with it.
          - app: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            DOCKER_BUILDKIT=1
