# .github/workflows/wiki-sync.yml in the Docusaurus repository.
# Pulls the Plane wiki, builds the site and deploys it to GitHub Pages.
#
# Repository settings:
#   Settings > Pages > Source: "GitHub Actions"
#   Variables: PLANE_URL (e.g. https://plane.example.com), PLANE_WORKSPACE_SLUG
#   Secrets:   PLANE_API_KEY (token of a bot user that is a workspace member)
#
# Triggers: every 6 hours as a safety net, manually, and `repository_dispatch`
# (event `plane-wiki-updated`) sent by a script or a poller (e.g. the trigger worker in the docs repository):
#   curl -X POST https://api.github.com/repos/OWNER/REPO/dispatches \
#     -H "Authorization: Bearer <token with contents:write>" \
#     -d '{"event_type":"plane-wiki-updated"}'
name: Wiki sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render every page (ignore the manifest cache)"
        type: boolean
        default: false
  repository_dispatch:
    types: [plane-wiki-updated]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# One build at a time; bursts of triggers collapse into at most one queued run.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    env:
      PLANE_URL: ${{ vars.PLANE_URL }}
      PLANE_WORKSPACE_SLUG: ${{ vars.PLANE_WORKSPACE_SLUG }}
      PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Incremental runs: keep the manifest and downloaded images between workflow runs.
      - uses: actions/cache@v4
        with:
          path: |
            .wiki-cache
            static/wiki-assets
            wiki
          key: wiki-sync-${{ github.run_id }}
          restore-keys: wiki-sync-

      - name: Sync wiki from Plane
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(sha256sum .wiki-cache/manifest.json 2>/dev/null | cut -d' ' -f1 || true)
          npm run sync:wiki -- ${{ inputs.force && '--force' || '' }}
          after=$(sha256sum .wiki-cache/manifest.json | cut -d' ' -f1)

          # Skip the build when the export is identical to the last one, unless the previous run
          # of this workflow did not succeed (its deploy may be missing) or this is a manual/push run.
          changed=true
          if [ -n "$before" ] && [ "$before" = "$after" ] \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && [ "${{ github.event_name }}" != "push" ]; then
            previous=$(gh api "repos/${{ github.repository }}/actions/workflows/wiki-sync.yml/runs?status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "none"')
            if [ "$previous" = "success" ]; then changed=false; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "manifest before=$before after=$after -> changed=$changed"

      - name: Build site
        if: steps.sync.outputs.changed == 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outputs.changed == 'true'
        with:
          path: build

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
